name: One-time Buddy to Sepand source replacement

on:
  push:
    branches: [ main ]
    paths:
      - "sepand-upload-trigger.txt"

permissions:
  contents: write

jobs:
  replace-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and validate Sepand source archive
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2 3; do test -s "sepand-source.part${part}.b64"; done
          mkdir -p "$RUNNER_TEMP/sepand-source"
          cat sepand-source.part{1..3}.b64 > "$RUNNER_TEMP/sepand-source/source.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/sepand-source/source.tar.xz.b64" > "$RUNNER_TEMP/sepand-source/source.tar.xz"
          tar -tJf "$RUNNER_TEMP/sepand-source/source.tar.xz" >/dev/null
          tar -xJf "$RUNNER_TEMP/sepand-source/source.tar.xz" -C "$RUNNER_TEMP/sepand-source"
          SOURCE="$RUNNER_TEMP/sepand-source/sepand-ai"
          test -f "$SOURCE/settings.gradle.kts"
          test -f "$SOURCE/app/src/main/AndroidManifest.xml"
          test -f "$SOURCE/.github/workflows/release.yml"

      - name: Replace repository root with Sepand AI
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/sepand-source/sepand-ai"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace Buddy Android source with Sepand AI 0.2.0-beta1"
          git push origin HEAD:main
