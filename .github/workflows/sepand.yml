name: Sepand Android beta build and release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'app/**'
      - 'libs/**'
      - 'scripts/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'docs/**'
      - '.github/workflows/sepand.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Configure Android SDK and install components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" 'platforms;android-37' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc
      - name: Prepare llama.kt native sources
        run: bash scripts/bootstrap.sh
      - name: Build OpenCL loader stub required by native linker
        run: bash libs/llama.kt/scripts/build-opencl.sh
      - name: Build testing APK
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sepand-ai-0.2.0-beta1.apk
      - uses: actions/upload-artifact@v7
        with:
          name: sepand-ai-0.2.0-beta1-testing-apk
          path: app/build/outputs/apk/debug/sepand-ai-0.2.0-beta1.apk
          if-no-files-found: error
      - name: Publish GitHub testing prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sepand-beta-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Sepand AI 0.2.0-beta1 · build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/sepand-ai-0.2.0-beta1.apk
