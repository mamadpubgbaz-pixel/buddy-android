name: Sepand Android build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare llama.kt
        run: bash scripts/bootstrap.sh
      - name: Build APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sepand-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
