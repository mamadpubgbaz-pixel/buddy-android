name: Sepand Android beta build and release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Install Android SDK components
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare llama.kt native sources
        run: bash scripts/bootstrap.sh
      - name: Build testing APK
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sepand-ai-0.2.0-beta1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sepand-ai-0.2.0-beta1-testing-apk
          path: app/build/outputs/apk/debug/sepand-ai-0.2.0-beta1.apk
          if-no-files-found: error
      - name: Publish GitHub testing prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sepand-beta-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Sepand AI 0.2.0-beta1 · build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/sepand-ai-0.2.0-beta1.apk
